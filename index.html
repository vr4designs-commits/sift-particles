<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sift — images into drifting particles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050506; --fg:255,255,255; --dim:.42; --mid:.62; --hi:.92;
  --font:Manrope,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme=light]{ --bg:#f4f4f1; --fg:16,16,18; --dim:.45; --mid:.65; --hi:.9; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;transition:background .5s}
body{font-family:var(--font);color:rgba(var(--fg),var(--mid));font-size:11px;letter-spacing:.2em;text-transform:uppercase;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#gl.drag{cursor:grabbing}
canvas#ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,label:focus-visible,input:focus-visible,svg:focus-visible{outline:1px solid rgba(var(--fg),.6);outline-offset:3px}

/* top */
#hint{position:fixed;top:18px;left:50%;transform:translateX(-50%);width:min(560px,70vw);text-align:center;line-height:1.9;font-size:10px;color:rgba(var(--fg),var(--dim));transition:opacity 1s;pointer-events:none}
#dl{position:fixed;top:16px;left:20px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:rgba(var(--fg),var(--hi))}
#dl:hover{background:rgba(var(--fg),.08)}
#dl svg{width:17px;height:17px}
#dl[disabled]{opacity:.35;pointer-events:none}
#topr{position:fixed;top:16px;right:20px;display:flex;align-items:center;gap:14px}
.cta{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border:1px solid rgba(var(--fg),.28);border-radius:999px;color:rgba(var(--fg),var(--hi));cursor:pointer;font-size:10px;transition:background .2s,border-color .2s}
.cta:hover{background:rgba(var(--fg),.08);border-color:rgba(var(--fg),.5)}
.cta[aria-disabled=true]{opacity:.35;pointer-events:none}
.cta svg{width:11px;height:11px}
#theme{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:rgba(var(--fg),var(--hi))}
#theme:hover{background:rgba(var(--fg),.08)}
#theme svg{width:18px;height:18px}

/* playaround: left middle, vertical */
#play{position:fixed;left:24px;top:50%;transform:translateY(-50%)}
#play .seg{flex-direction:column;align-items:flex-start;gap:12px}
#play .seg .lab,#parts .seg .lab{font-size:8px;letter-spacing:.3em;color:rgba(var(--fg),.4);margin:0 0 12px;padding:5px 7px 5px 9px;background:rgba(var(--fg),.04);border-radius:3px}
#parts{position:fixed;right:24px;top:50%;transform:translateY(-50%)}
#parts .seg{flex-direction:column;align-items:flex-end;gap:12px}
#panel{display:contents}
#sheetBtn,.fhelp{display:none}
/* footer */
#foot{position:fixed;left:0;right:0;bottom:0;padding:0 28px 20px;display:flex;align-items:flex-end;justify-content:center;gap:40px}
.ctrls{display:flex;flex-direction:column;gap:16px}
.sliders{display:flex;gap:30px}
.sl{display:flex;align-items:center;gap:14px;font-size:10px;color:rgba(var(--fg),var(--dim))}
.sl span{min-width:52px}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:14px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(var(--fg),.25)}
input[type=range]::-moz-range-track{height:1px;background:rgba(var(--fg),.25)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-5px;border-radius:50%;background:rgb(var(--fg));border:0}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:rgb(var(--fg));border:0}
.row{display:flex;justify-content:flex-end;gap:40px;flex-wrap:wrap}
.seg{display:flex;align-items:center;gap:14px;font-size:10px}
.seg .lab{color:rgba(var(--fg),.3);margin-right:2px}
.seg button{padding:3px 0;color:rgba(var(--fg),var(--dim));border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.seg button:hover{color:rgba(var(--fg),var(--hi))}
.seg button.on{color:rgba(var(--fg),var(--hi));border-bottom-color:rgba(var(--fg),.7)}
.padwrap{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:9px;color:rgba(var(--fg),var(--dim))}
#pad{width:76px;height:76px;cursor:pointer;touch-action:none;overflow:visible}
#pad .fr{fill:none;stroke:rgba(var(--fg),.2)}
#pad #pdSide{fill:rgba(var(--fg),.08)}
#pad line{stroke:rgb(var(--fg));vector-effect:non-scaling-stroke;stroke-width:1.2}
#pad #pdStem{stroke:rgba(var(--fg),.7)}
#pad #pdTip{fill:rgb(var(--fg))}
#pad .end{fill:var(--bg);stroke:rgb(var(--fg));vector-effect:non-scaling-stroke;stroke-width:1.2}

#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);max-width:min(520px,86vw);padding:10px 16px;background:rgba(var(--fg),.08);border:1px solid rgba(var(--fg),.18);backdrop-filter:blur(8px);font-size:10px;line-height:1.7;text-align:center;color:rgba(var(--fg),var(--hi));transition:opacity .5s;pointer-events:none}
#toast.bad{border-color:rgba(255,110,90,.5)}
#drop{position:fixed;inset:14px;border:1px dashed rgba(var(--fg),.4);display:grid;place-items:center;font-size:12px;color:rgba(var(--fg),var(--hi));opacity:0;pointer-events:none;transition:opacity .2s}
body.dragging #drop{opacity:1}
body.hide-ui #panel,body.hide-ui #dl,body.hide-ui #play,body.hide-ui #parts,body.hide-ui #foot,body.hide-ui #topr,body.hide-ui #hint{opacity:0;pointer-events:none}
#dl,#play,#parts,#foot,#topr{transition:opacity .4s}

@media (max-width:900px){
  #foot{flex-direction:column;align-items:stretch;gap:14px;padding:0 16px 14px}
  .sliders{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
  .sl input{flex:1;width:auto}
  .padwrap{position:absolute;right:16px;top:-108px}
  #pad{width:64px;height:64px}
  .row{gap:12px}
  #topr{right:12px;top:12px}
  #dl{left:12px;top:12px}
  #hint{top:58px;width:90vw}
  #play{left:12px}
  #parts{right:12px}
  #parts .seg{gap:9px}
  #play .seg{gap:9px}
}
/* ---------- phones: everything lives in one bottom sheet ---------- */
@media (max-width:759px){
  #topr{right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top))}
  #dl{left:max(10px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top))}
  .cta{height:36px;padding:0 14px}
  #theme,#dl{width:38px;height:38px}
  #hint{top:calc(max(12px,env(safe-area-inset-top)) + 52px);width:90vw}
  #toast{bottom:auto;top:calc(max(12px,env(safe-area-inset-top)) + 56px)}

  #panel{display:grid;grid-template-columns:1fr auto;column-gap:16px;
    grid-template-areas:"sliders sliders" "layers layers" "parts flow" "btn btn";
    position:fixed;left:0;right:0;bottom:0;z-index:5;max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    background:var(--bg);border-top:1px solid rgba(var(--fg),.14);
    padding:4px max(20px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));transition:background .5s,padding .3s}
  #foot{display:contents}
  #play,#parts{position:static;transform:none}
  .ctrls{grid-area:sliders;gap:0}
  #play{grid-area:layers} #parts{grid-area:parts}
  .padwrap{grid-area:flow;position:static}
  #sheetBtn{grid-area:btn}

  .sliders{display:flex;flex-direction:column;gap:0}
  .sl{height:38px;gap:14px;font-size:10px;letter-spacing:.24em}
  .sl span{min-width:64px}
  .sl input{flex:1;width:auto;height:38px}
  input[type=range]::-webkit-slider-thumb{width:20px;height:20px;margin-top:-10px}
  input[type=range]::-moz-range-thumb{width:20px;height:20px}

  /* tag label above, options in a row */
  #play .seg,#parts .seg{display:grid;justify-content:start;column-gap:18px;row-gap:2px;padding:12px 0 6px;font-size:10px}
  #play .seg{grid-template-columns:repeat(5,auto);border-top:1px solid rgba(var(--fg),.07)}
  #parts .seg{grid-template-columns:repeat(2,auto)}
  #play .seg .lab,#parts .seg .lab,.padwrap .flab{grid-column:1/-1;justify-self:start;margin:0 0 2px;font-size:8px;letter-spacing:.3em;color:rgba(var(--fg),.4);padding:5px 7px 5px 9px;background:rgba(var(--fg),.04);border-radius:3px}
  .seg button{padding:9px 0 4px}
  #parts{border-top:1px solid rgba(var(--fg),.07)}

  .padwrap{flex-direction:column;align-items:flex-end;gap:8px;padding:12px 0 8px;border-top:1px solid rgba(var(--fg),.07)}
  .padwrap .flab{align-self:flex-end}
  #pad{width:66px;height:66px}

  #sheetBtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:44px;font-size:10px;letter-spacing:.32em;color:rgba(var(--fg),var(--mid));border-top:1px solid rgba(var(--fg),.07)}
  #sheetBtn svg{width:10px;height:6px;transition:transform .3s}
  body.sheet-closed #panel > :not(#sheetBtn),body.sheet-closed #foot > *{display:none}
  body.sheet-closed #sheetBtn{border-top:0}
  body.sheet-closed #panel{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  body.sheet-closed #sheetBtn svg{transform:rotate(180deg)}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>

<button id="dl" type="button" aria-label="Download the current frame as a PNG" title="Download PNG">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11.5M7 10.5l5 5 5-5M4.5 19.5h15"/></svg>
</button>

<div id="hint"></div>

<div id="topr">
  <label class="cta" for="fileImg" id="addBtn" tabindex="0" role="button">
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 1v10M1 6h10"/></svg>
    Add image
  </label>
  <button id="theme" type="button" aria-label="Switch to light mode" title="Switch to light mode (B)"></button>
  <input type="file" id="fileImg" accept="image/*" multiple hidden>
</div>


<div id="panel">
<nav id="play">
<div class="seg" id="segDraw" role="group" aria-label="Layers"><span class="lab">Layers</span>
        <button data-v="track" class="on" aria-pressed="true">Track</button>
        <button data-v="links" class="on" aria-pressed="true">Links</button>
        <button data-v="scan" aria-pressed="false">Scan</button>
        <button data-v="trails" aria-pressed="false">Trails</button>
        <button data-v="marks" class="on" aria-pressed="true">Marks</button>
</div>
</nav>

<nav id="parts">
<div class="seg" id="segTrk" role="group" aria-label="Particles"><span class="lab">Particles</span>
        <button data-v="sparse" aria-pressed="false">Sparse</button>
        <button data-v="dense" class="on" aria-pressed="true">Dense</button>
</div>
</nav>

<footer id="foot">
  <div class="ctrls">
    <div class="sliders">
      <label class="sl"><span>Wind</span><input type="range" id="wind" min="0" max="100" value="80" aria-label="Wind: how hard particles past the line blow away"></label>
      <label class="sl"><span>Burst</span><input type="range" id="burst" min="0" max="100" value="70" aria-label="Burst: how hard particles are thrown on a change"></label>
      <label class="sl"><span>Form</span><input type="range" id="form" min="0" max="100" value="33" aria-label="Form: how quickly particles settle into the next image"></label>
      <label class="sl"><span>Relief</span><input type="range" id="relief" min="0" max="100" value="20" aria-label="Relief: depth of the image"></label>
    </div>
  </div>
  <div class="padwrap">
    <span class="flab">Flow</span>
    <svg id="pad" viewBox="-1.3 -1.3 2.6 2.6" tabindex="0" role="img" aria-label="Flow: the line particles stream away from. Drag near the middle to move it, near an end to turn it, tap a side to make particles stream off that side. Arrow keys turn and move it, F flips the side.">
      <defs><clipPath id="pdClip"><rect x="-1" y="-1" width="2" height="2"/></clipPath></defs>
      <g clip-path="url(#pdClip)"><rect id="pdSide" x="-4" y="0" width="8" height="4"/></g>
      <rect class="fr" x="-1" y="-1" width="2" height="2" vector-effect="non-scaling-stroke"/>
      <g clip-path="url(#pdClip)"><line id="pdLine"/></g>
      <line id="pdStem"/>
      <circle id="pdTip" r="0.07"/>
      <circle id="pdA" class="end" r="0.09"/>
      <circle id="pdB" class="end" r="0.09"/>
    </svg>
  </div>
</footer>
<button id="sheetBtn" type="button" aria-expanded="true" aria-controls="panel">Settings <svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1 1l4 4 4-4"/></svg></button>
</div>

<div id="toast" hidden></div>
<div id="drop">Drop images to add them</div>

<script>
"use strict";
/* ---------- basics ---------- */
const $ = id => document.getElementById(id);
const MOBILE = innerWidth < 760;
const R = MOBILE ? 512 : 1024, RB = Math.round(Math.log2(R));
const MAXPICS = 6;
const TANF = Math.tan(17 * Math.PI / 180);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const now = () => performance.now() / 1000;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand32 = () => (Math.random() * 4294967296) >>> 0;

const S = {
  bits: 18, N: 0, tw: 0, th: 0,
  pics: [], cur: -1,
  slots: [null, null, null],
  flights: [{t0:-1e9,dur:1,mo:[1,1,0,0]},{t0:-1e9,dur:1,mo:[1,1,0,0]}],
  wind: .8, burst: .7, form: .33, relief: .2,
  line: {x: 0, y: 0, ang: 1.72}, side: -1,
  theme: 'dark',
  draw: {track: true, links: true, scan: false, trails: false, marks: true},
  dense: true
};
const cam = {yaw: 0, pitch: 0, zoom: 1};

/* ---------- messages ---------- */
let hintT = 0;
function hint(text, ms){ const h = $('hint'); clearTimeout(hintT); h.textContent = text; h.style.opacity = 1; if (ms) hintT = setTimeout(() => h.style.opacity = 0, ms); }
let toastT = 0;
function toast(text, bad){ const t = $('toast'); t.hidden = false; t.textContent = text; t.classList.toggle('bad', !!bad); t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.hidden = true, 600); }, bad ? 6000 : 3200); }

/* ---------- WebGL ---------- */
const cv = $('gl');
const gl = cv.getContext('webgl2', {antialias: false, alpha: false, powerPreference: 'high-performance'});

const VS = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D uPosA, uPosB, uPosC, uColA, uColB, uColC;
uniform uvec2 uPermA, uPermB, uPermC;
uniform uint uMask, uWMask, uShift, uStride;
uniform float uMixAB, uMixBC;
uniform vec4 uFlAB, uFlBC;        // swarm, seed, wait, burst rate
uniform mat4 uVP;
uniform float uTime, uRelief, uDist, uSize, uMinPx, uGain, uAspect, uBreath;
uniform vec4 uLine;               // point on line, normal toward the drifting side
uniform vec3 uWind;               // direction + strength
uniform vec4 uBrush[6];
uniform float uPass;              // 0 particles, 2 trails
uniform vec2 uScan;
uniform float uTail, uTrails, uInk, uFade;
uniform vec3 uSlotInk;
out vec3 vCol;

uint hashu(uint x){ x ^= x >> 16; x *= 0x7feb352dU; x ^= x >> 15; x *= 0x846ca68bU; x ^= x >> 16; return x; }
float h01(uint x){ return float(hashu(x) >> 8) * 5.9604645e-8; }
ivec2 cell(uvec2 perm, uint i){ uint s = (i * perm.x + perm.y) & uMask; return ivec2(int(s & uWMask), int(s >> uShift)); }
float ease(float s){ return s*s*s*(s*(s*6.0-15.0)+10.0); }
vec3 tone(vec3 c, float slotInk){ return mix(c, max(1.0 - c, vec3(0.35)), abs(slotInk - uInk)); }
vec3 flow(vec3 q, float t){
  return 0.5 * vec3(sin(q.y*2.3+t) + sin(q.z*3.1 - t*0.7 + q.x),
                    sin(q.x*2.7 - t*0.8) + sin(q.z*2.9 + t*0.6 + q.y),
                    sin(q.x*3.3 + t*0.5) + sin(q.y*3.7 - t));
}
float flight(float m, vec4 mo, uint i, vec3 a, vec3 b, out vec3 arc){
  uint sd = uint(mo.y);
  float rd = h01(i * 2654435761u + sd), burst = step(0.5, mo.w);
  float delay = mix(clamp(0.5 - a.z, 0.0, 1.0)*0.7 + rd*0.3, rd, mo.x);
  float g = max(0.0, (m - mo.z) / (1.0 - mo.z)), sg = mix(0.9, 0.6, mo.x);
  float e = ease(clamp(g*(1.0+sg) - delay*sg, 0.0, 1.0));
  float hump = sin(3.14159265 * e);
  vec3 rv = vec3(h01(i ^ (sd*3u+11u)), h01(i*7u + sd + 5u), h01(i*13u + sd*5u + 3u)) * 2.0 - 1.0;
  arc = rv * hump * mix(0.05, 0.2, mo.x) * (0.3 + length(b - a) * 0.5);
  float far = h01(i*29u + sd*7u + 1u); far = 0.1 + 0.9*far*far;
  float thrown = (1.0 - exp(-m * mo.w)) * (1.0 - e) * (0.72 + 0.5*m*(2.0-m)) * burst;
  vec3 dir = normalize(vec3(a.xy*0.9 + rv.xy*0.85, 0.3 + 0.9*abs(rv.z)));
  arc += dir * thrown * 0.6 * far + flow(a*1.7 + rv*0.25, uTime*1.3) * thrown * 0.1;
  return e;
}
void main(){
  bool streak = uPass > 1.5; uint vid = uint(gl_VertexID);
  uint i = (streak ? vid >> 1u : vid) * uStride; float tail = streak ? float(vid & 1u) : 0.0;
  ivec2 cC = cell(uPermC, i);
  vec3 p = texelFetch(uPosC, cC, 0).xyz;
  vec3 col = tone(texelFetch(uColC, cC, 0).rgb, uSlotInk.z);
  float air = 0.0;
  if (uMixBC < 1.0){
    ivec2 cB = cell(uPermB, i);
    vec3 q = texelFetch(uPosB, cB, 0).xyz;
    vec3 cq = tone(texelFetch(uColB, cB, 0).rgb, uSlotInk.y);
    if (uMixAB < 1.0){
      ivec2 cA = cell(uPermA, i);
      vec3 o = texelFetch(uPosA, cA, 0).xyz; vec3 arcA;
      float eA = flight(uMixAB, uFlAB, i, o, q, arcA);
      q = mix(o, q, eA) + arcA;
      cq = mix(tone(texelFetch(uColA, cA, 0).rgb, uSlotInk.x), cq, eA);
    }
    vec3 arc; float e = flight(uMixBC, uFlBC, i, q, p, arc);
    p = mix(q, p, e) + arc; col = mix(cq, col, e); air = sin(3.14159265 * e);
  }
  float near = clamp(p.z + 0.5, 0.0, 1.0);
  float r1 = h01(i*3u+17u), r2 = h01(i*5u+29u), r3 = h01(i*11u+71u), r4 = h01(i*17u+113u), r5 = h01(i*23u+191u);

  p.xy *= 1.0 + 0.011 * uBreath;
  p.z = p.z * uRelief * (1.0 + 0.1*uBreath) + 0.014 * uBreath;
  p += flow(p*2.0 + r2*3.0, uTime*0.2) * 0.0035;

  // drift past the line, with a soft, wavering edge
  float along = dot(p.xy - uLine.xy, vec2(-uLine.w, uLine.z));
  float wobble = 0.11*sin(along*3.1 + uTime*0.13) + 0.06*sin(along*7.7 - uTime*0.09 + 1.7) + (r5 - 0.5)*0.34;
  float away = smoothstep(0.0, 1.15, dot(p.xy - uLine.xy, uLine.zw) + wobble) * step(0.004, uWind.z);
  float alive = 1.0, gone = 0.0, home = 1.0;
  if (away > 0.0){
    float per = 3.5 + 5.5*r1, ph = fract((uTime - tail*uTail)/per + r2);
    float hold = mix(0.82, 0.06, away);
    gone = max(0.0, (ph - hold) / (1.0 - hold));
    float tr = gone*sqrt(gone), reach = uWind.z * 1.8 * away * (0.55 + 0.9*r3);
    vec3 tb = flow(p*1.7 + vec3(r4*7.0, r1*5.0, r3*3.0), uTime*0.3 + ph*2.5);
    p.xy += uWind.xy * reach * tr;
    p += tb * tr * reach * 0.3;
    p.z += (r4 - 0.5) * tr * reach * 0.6;
    alive = mix(1.0, smoothstep(0.0, 0.07, ph) * (1.0 - smoothstep(0.3, 1.0, gone)), smoothstep(0.0, 0.3, away));
    home = (1.0 + 0.6*away*(1.0-away)*(1.0 - min(1.0, gone*6.0))) * (1.0 - 0.6*away*away);
  }

  if (!files.length) return;

}

(function(){

    pts.set(e.pointerId, {x: e.clientX, y: e.clientY}); cv.setPointerCapture(e.pointerId);
    if (pts.size === 2){ const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
    cv.classList.add('drag'); e.preventDefault();

  cv.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return wakeMove(e);
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;

    else if (pts.size === 2){ const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch > 0 && d > 0) cam.zoom = clamp(cam.zoom*pinch/d, .3, 3); pinch = d; }

/* ---------- the LINE pad ---------- */
const veil = {until: 0};
function drawPad(){
  const v = lineVec(), L = S.line, stem = .2 + .45*S.wind;
  const set = (id, attrs) => { const n = $(id); for (const k in attrs) n.setAttribute(k, typeof attrs[k] === 'number' ? attrs[k].toFixed(3) : attrs[k]); };
  set('pdLine', {x1: L.x - 4*v.tx, y1: -(L.y - 4*v.ty), x2: L.x + 4*v.tx, y2: -(L.y + 4*v.ty)});
  set('pdSide', {transform: 'matrix(' + [v.tx, -v.ty, v.nx, -v.ny, L.x, -L.y].map(n => n.toFixed(4)).join(' ') + ')'});
  set('pdStem', {x1: L.x, y1: -L.y, x2: L.x + v.nx*stem, y2: -(L.y + v.ny*stem)});
  set('pdTip', {cx: L.x + v.nx*stem, cy: -(L.y + v.ny*stem)});
  set('pdA', {cx: L.x + .72*v.tx, cy: -(L.y + .72*v.ty)});
  set('pdB', {cx: L.x - .72*v.tx, cy: -(L.y - .72*v.ty)});
  veil.until = now() + 1.6;
}
(function(){
  const pad = $('pad'); let drag = null;
  const local = e => { const r = pad.getBoundingClientRect(); return {x: (e.clientX - r.left)/r.width*2.6 - 1.3, y: -((e.clientY - r.top)/r.height*2.6 - 1.3)}; };
  pad.addEventListener('pointerdown', e => {
    const p = local(e), L = S.line, c = Math.cos(L.ang), s = Math.sin(L.ang), dx = p.x - L.x, dy = p.y - L.y;
    const along = dx*c + dy*s, across = -dx*s + dy*c;
    if (Math.abs(across) > .24){ S.side = across < 0 ? -1 : 1; drawPad(); return; }
    drag = {kind: Math.abs(along) > .42 ? 'turn' : 'move', flip: along < 0, p, x: L.x, y: L.y};
    pad.setPointerCapture(e.pointerId); e.preventDefault();
  });
  pad.addEventListener('pointermove', e => {
    if (!drag) return; const p = local(e), L = S.line;
    if (drag.kind === 'move'){ L.x = clamp(drag.x + p.x - drag.p.x, -1.1, 1.1); L.y = clamp(drag.y + p.y - drag.p.y, -1.1, 1.1); }
    else { const dx = p.x - L.x, dy = p.y - L.y; if (Math.hypot(dx, dy) > .08) L.ang = Math.atan2(dy, dx) + (drag.flip ? Math.PI : 0); }
    drawPad();
  });
  const end = () => { drag = null; };
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
  pad.addEventListener('keydown', e => {
    const L = S.line, k = e.key, m = e.shiftKey ? 3 : 1; let used = true;
    if (k === 'ArrowLeft') L.ang += .05*m;
    else if (k === 'ArrowRight') L.ang -= .05*m;
    else if (k === 'ArrowUp' || k === 'ArrowDown'){ const d = (k === 'ArrowUp' ? .04 : -.04)*m*S.side; L.x = clamp(L.x - Math.sin(L.ang)*d, -1.1, 1.1); L.y = clamp(L.y + Math.cos(L.ang)*d, -1.1, 1.1); }
    else if (k.toLowerCase() === 'f') S.side = -S.side;
    else used = false;
    if (used){ e.preventDefault(); e.stopPropagation(); drawPad(); }
  });
})();

/* ---------- trackers + marks overlay ---------- */
const ov = $('ov'), g2 = ov.getContext('2d');
const TR = {list: []};
function resetTrackers(delay){
  const t = now(), nf = MOBILE ? 5 : 8, nr = MOBILE ? 2 : 3, old = TR.list;
  TR.list = [];
  for (let i = 0; i < nf + nr; i++){
    const o = old[i] || {};
    TR.list.push({ride: i >= nf, f: i, id: i + 1, sx: o.sx ?? null, sy: o.sy ?? null, hx: 0, hy: 0, hopAt: 0,
      lockAt: t + (delay ? delay*(.5 + .45*Math.random()) : 0), r1: Math.random(), r2: Math.random(), r3: Math.random(), r4: Math.random(), cyc: -1, home: null});
  }
}
const fmt = v => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(2);
const pad2 = n => String(n).padStart(2, '0');
function drawOverlay(t, dt, C, live){
  g2.setTransform(DPR, 0, 0, DPR, 0, 0); g2.clearRect(0, 0, CW, CH);
  const rgb = live.ink ? '16,16,18,' : '255,255,255,', fa = live.amt;
  const stroke = (a, fn) => { g2.strokeStyle = 'rgba(' + rgb + (a*fa).toFixed(3) + ')'; g2.lineWidth = 1; g2.beginPath(); fn(); g2.stroke(); };
  const text = (a, s, x, y, align) => { g2.fillStyle = 'rgba(' + rgb + (a*fa).toFixed(3) + ')'; g2.textAlign = align || 'left'; g2.fillText(s, x, y); };
  g2.font = '500 9px Manrope, "Helvetica Neue", Arial, sans-serif';
  try { g2.letterSpacing = '1.5px'; } catch (e) {}

  if (S.draw.marks) drawMarks(t, stroke, text);

  // the line, shown on the image for a moment after it changes
  const va = clamp((veil.until - t)/.6, 0, 1);
  if (va > 0){
    const v = lineVec(), L = S.line, rr = 1.22, len = .14 + .62*S.wind;
    const a = project(C, L.x - v.tx*rr, L.y - v.ty*rr, 0), b = project(C, L.x + v.tx*rr, L.y + v.ty*rr, 0), c = project(C, L.x, L.y, 0), d = project(C, L.x + v.nx*len, L.y + v.ny*len, 0);
    if (a && b && c && d){
      g2.setLineDash([4, 5]); stroke(.55*va, () => { g2.moveTo(a.x, a.y); g2.lineTo(b.x, b.y); }); g2.setLineDash([]);
      stroke(.8*va, () => { g2.moveTo(c.x, c.y); g2.lineTo(d.x, d.y); });
      g2.fillStyle = 'rgba(' + rgb + (.9*va*fa).toFixed(3) + ')'; g2.beginPath(); g2.arc(d.x, d.y, 3, 0, 7); g2.fill();
      text(.6*va, 'WIND ' + Math.round(S.wind*100), d.x + 8, d.y + 3);
    }
  }

  const pic = S.pics[S.cur];
  if (!pic || !pic.feats || !pic.feats.length || !(S.draw.track || S.draw.links)) return;
  const B = live.breath, sc = 1 + .011*B, depth = live.relief*(1 + .1*B), lift = .014*B;
  const v = lineVec(), L = S.line, wind = 1.5*S.wind, F = pic.feats, pts = [];
  for (const o of TR.list){
    let x, y, z, alpha = 1;
    if (o.ride){
      const e = t/(3.5 + 5.5*o.r1) + o.r2, n = Math.floor(e), ph = e - n;
      if (n !== o.cyc || !o.home){ o.cyc = n; const side = F.filter(p => (p.x - L.x)*v.nx + (p.y - L.y)*v.ny > .35); const pool = side.length ? side : F; o.home = pool[Math.floor(Math.random()*pool.length)]; }
      x = o.home.x*sc; y = o.home.y*sc; z = o.home.z*depth + lift;
      const h = wind > .004 ? sstep(0, 1.15, (x - L.x)*v.nx + (y - L.y)*v.ny) : 0;
      if (h > 0){
        const hold = lerp(.82, .06, h), gone = Math.max(0, (ph - hold)/(1 - hold)), tr = gone*Math.sqrt(gone), reach = 1.8*wind*h*(.55 + .9*o.r3);

      const p = F[o.f % F.length]; x = p.x*sc; y = p.y*sc; z = p.z*depth + lift;
    }
    const q = project(C, x, y, z); if (!q) continue;
    if (o.sx == null){ o.sx = o.hx = q.x; o.sy = o.hy = q.y; }
    if (t >= o.lockAt){ const k = Math.min(1, 16*dt); o.sx += (q.x - o.sx)*k; o.sy += (q.y - o.sy)*k; }
    else {
      if (t >= o.hopAt){ o.hopAt = t + .06 + .13*Math.random(); o.hx = o.sx + 110*(Math.random() - .5); o.hy = o.sy + 110*(Math.random() - .5); }

  }

    const seen = new Set();
    for (let i = 0; i < pts.length; i++){
      let best = -1, bd = 1e9;
      for (let j = 0; j < pts.length; j++){ if (i === j) continue; const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y); if (d < bd){ bd = d; best = j; } }
      for (const j of [best, (i + 1) % pts.length]){
        if (j < 0 || j === i) continue; const key = Math.min(i, j) + ':' + Math.max(i, j); if (seen.has(key)) continue; seen.add(key);
        stroke(.28*Math.min(pts[i].a, pts[j].a), () => { g2.moveTo(pts[i].x, pts[i].y); g2.lineTo(pts[j].x, pts[j].y); });

    for (const p of pts){
      const b = 8, c = 4, x = Math.round(p.x) + .5, y = Math.round(p.y) + .5, a = .85*p.a;
      stroke(a, () => {
        g2.moveTo(x - b, y - b + c); g2.lineTo(x - b, y - b); g2.lineTo(x - b + c, y - b);
        g2.moveTo(x + b - c, y - b); g2.lineTo(x + b, y - b); g2.lineTo(x + b, y - b + c);
        g2.moveTo(x + b, y + b - c); g2.lineTo(x + b, y + b); g2.lineTo(x + b - c, y + b);
        g2.moveTo(x - b + c, y + b); g2.lineTo(x - b, y + b); g2.lineTo(x - b, y + b - c);
        g2.moveTo(x - 2, y); g2.lineTo(x + 2, y); g2.moveTo(x, y - 2); g2.lineTo(x, y + 2);
      });
      if (p.locked) text(.7*p.a, pad2(p.o.id) + '  ' + fmt(p.X) + ' ' + fmt(p.Y) + ' ' + fmt(p.Z), x + b + 5, y + 3);

}
function drawMarks(t, stroke, text){
  const st = STAGE, availH = Math.max(160, CH - st.bottom - st.top), availW = Math.max(160, CW - st.side);
  const half = Math.min(availH, availW)*st.fit*.5*1.12, cx = CW/2, cy = st.top + availH/2;
  const hw = Math.min(half, CW/2 - 22), hh = Math.min(half, availH/2 - 26);
  const x0 = Math.round(cx - hw) + .5, x1 = Math.round(cx + hw) + .5, y0 = Math.round(cy - hh) + .5, y1 = Math.round(cy + hh) + .5;
  const ext = 16;
  stroke(.22, () => {
    for (const [x, y] of [[x0, y0], [x1, y0], [x0, y1], [x1, y1]]){ g2.moveTo(x - ext, y); g2.lineTo(x + ext, y); g2.moveTo(x, y - ext); g2.lineTo(x, y + ext); }
  });
  const sweep = (t*.07) % 1;
  stroke(.16, () => {
    for (let x = x0 + 24; x < x1 - 20; x += 6){ const big = Math.round((x - x0)/6) % 8 === 0, l = big ? 7 : 3; g2.moveTo(x, y0 - 10); g2.lineTo(x, y0 - 10 + l); g2.moveTo(x, y1 + 10); g2.lineTo(x, y1 + 10 - l); }
    for (let y = y0 + 24; y < y1 - 20; y += 6){ const big = Math.round((y - y0)/6) % 8 === 0, l = big ? 7 : 3; g2.moveTo(x0 - 10, y); g2.lineTo(x0 - 10 + l, y); g2.moveTo(x1 + 10, y); g2.lineTo(x1 + 10 - l, y); }
  });
  const sx = x0 + 24 + (x1 - x0 - 44)*sweep;
  stroke(.4, () => { g2.moveTo(sx, y0 - 14); g2.lineTo(sx, y0 - 1); g2.moveTo(x1 + x0 - sx, y1 + 1); g2.lineTo(x1 + x0 - sx, y1 + 14); });
  const pic = S.pics[S.cur];
  if (pic) text(.45, pad2(S.cur + 1) + ' / ' + pad2(S.pics.length) + '   ' + pic.name.toUpperCase(), x0 + 4, y0 - 18);
  text(.45, 'WIND ' + Math.round(S.wind*100), x1 - 4, y0 - 18, 'right');
  text(.35, S.N.toLocaleString('en-US') + ' PTS', x0 + 4, y1 + 26);
  text(.35, 'RELIEF ' + Math.round(S.relief*100), x1 - 4, y1 + 26, 'right');
}

/* ---------- frame ---------- */
let CAM = null, lastT = now();
function frame(){
  requestAnimationFrame(frame);
  const t = now(), dt = Math.min(.1, t - lastT); lastT = t;
  if (glLost) return;
  if (!STAGE) resize();
  STAGE.bottom += (STAGE.goal - STAGE.bottom)*Math.min(1, dt*7);
  const W = cv.width, H = cv.height, live = fadeState(t);
  const C = camera(t); CAM = C;
  const bg = [lerp(5, 244, live.mix), lerp(5, 244, live.mix), lerp(6, 241, live.mix)];
  gl.viewport(0, 0, W, H); gl.clearColor(bg[0]/255, bg[1]/255, bg[2]/255, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  if (live.ink) gl.blendFunc(gl.ZERO, gl.SRC_COLOR); else gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_COLOR);
  const relief = lerp(.05, 1.5, S.relief);
  const L5 = t/5.6 % 1, breath = 2*(L5 < .42 ? -Math.cos(Math.PI*L5/.42) : Math.cos(Math.PI*(L5 - .42)/.58))*.5;
  live.breath = breath; live.relief = relief;

  const Cs = S.slots[2];
  if (Cs){
    const mBC = S.slots[1] ? prog(1, t) : 1, mAB = S.slots[0] ? prog(0, t) : 1;
    const Bs = mBC < 1 ? S.slots[1] : Cs, As = (mBC < 1 && mAB < 1) ? S.slots[0] : Bs;
    const u = G.u;
    gl.useProgram(G.prog); gl.bindVertexArray(G.vao);
    [As, Bs, Cs].forEach((s, k) => { gl.activeTexture(gl.TEXTURE0 + k); gl.bindTexture(gl.TEXTURE_2D, s.form.pos); gl.activeTexture(gl.TEXTURE3 + k); gl.bindTexture(gl.TEXTURE_2D, s.form.col); });
    gl.uniform2ui(u.uPermA, As.perm[0], As.perm[1]); gl.uniform2ui(u.uPermB, Bs.perm[0], Bs.perm[1]); gl.uniform2ui(u.uPermC, Cs.perm[0], Cs.perm[1]);
    gl.uniform1ui(u.uMask, S.N - 1); gl.uniform1ui(u.uWMask, S.tw - 1); gl.uniform1ui(u.uShift, Math.round(Math.log2(S.tw)));
    gl.uniform1f(u.uMixAB, mAB); gl.uniform1f(u.uMixBC, mBC);

    gl.uniformMatrix4fv(u.uVP, false, C.m);

    gl.uniform1f(u.uTime, t); gl.uniform1f(u.uRelief, relief); gl.uniform1f(u.uDist, C.D); gl.uniform1f(u.uSize, k);
    gl.uniform1f(u.uMinPx, 1); gl.uniform1f(u.uGain, gain); gl.uniform1f(u.uAspect, C.a); gl.uniform1f(u.uBreath, breath);

    gl.uniform4f(u.uLine, S.line.x, S.line.y, v.nx, v.ny);
    gl.uniform3f(u.uWind, v.nx, v.ny, 1.5*S.wind);
    gl.uniform4fv(u.uBrush, wakeUniform(t));
    gl.uniform1f(u.uPass, 0); gl.uniform1ui(u.uStride, 1); gl.drawArrays(gl.POINTS, 0, S.N);

  }

}

/* ---------- particle density ---------- */
const DENSE_BITS = MOBILE ? 17 : ((navigator.hardwareConcurrency || 4) >= 8 ? 19 : 18);
const SPARSE_BITS = DENSE_BITS - 2;
function applyBits(bits){ S.bits = bits; S.N = 1 << bits; S.tw = 1 << Math.ceil(bits/2); S.th = S.N/S.tw; }
/* throw away every GPU form and rebuild: the current picture first, the rest a little later */
let rebuildRun = 0;
async function rebuildForms(dur){
  const run = ++rebuildRun;
  for (const p of S.pics) p.form = null;
  G.dust = dustForm();
  S.slots = [null, null, {form: G.dust, perm: [1, 0]}]; S.flights.forEach(f => f.t0 = -1e9);
  const cur = S.pics[S.cur];
  if (cur){ cur.form = buildForm(cur); retarget(cur.form, dur, true); resetTrackers(dur); }
  gc();
  for (const p of S.pics.slice()){
    await sleep(40);
    if (run !== rebuildRun) return;
    if (!p.form && S.pics.includes(p)) p.form = buildForm(p);
  }
}
function setDensity(dense){
  S.dense = dense; const bits = dense ? DENSE_BITS : SPARSE_BITS;
  if (bits === S.bits) return;
  applyBits(bits);                                  // old forms are the wrong size now
  rebuildForms(1.4);
}

/* ---------- lost GPU (common on phones when the tab is backgrounded) ---------- */
let glLost = false;
cv.addEventListener('webglcontextlost', e => { e.preventDefault(); glLost = true; });
cv.addEventListener('webglcontextrestored', () => {
  try {
    G.forms.clear(); G.u = {};                       // old textures and program died with the context
    compile();
    glLost = false;
    rebuildForms(1.4);
  } catch (err) { hint('Could not restart the particles: ' + err.message); console.error(err); }
});

/* ---------- download ---------- */
const shot = {want: false, busy: false};
function capture(bg){
  const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
  const g = c.getContext('2d');
  g.fillStyle = 'rgb(' + bg.map(Math.round).join(',') + ')'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(cv, 0, 0); g.drawImage(ov, 0, 0);
  c.toBlob(blob => saveBlob(blob).finally(() => { shot.busy = false; $('dl').disabled = false; }), 'image/png');
}
async function saveBlob(blob){
  if (!blob) return toast('Could not capture the frame.', true);
  const pic = S.pics[S.cur], name = 'sift-' + ((pic && !pic.demo ? pic.name : 'sample').replace(/[^\w-]+/g, '-').toLowerCase()) + '-' + Date.now().toString(36) + '.png';
  if (window.claude && window.claude.use){
    const d = await window.claude.use('downloads').catch(() => null);
    if (d){ try { await d.save({filename: name, data: blob}); } catch (e) { if (e && e.code !== 'declined') toast('Download is not available here.', true); } return; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
$('dl').onclick = () => { if (shot.busy) return; shot.busy = true; shot.want = true; $('dl').disabled = true; };

/* ---------- controls ---------- */
for (const [id, fn] of [['wind', v => { S.wind = v; drawPad(); }], ['burst', v => S.burst = v], ['form', v => S.form = v], ['relief', v => S.relief = v]])
  $(id).addEventListener('input', e => fn(Number(e.target.value)/100));
$('segDraw').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const on = !S.draw[b.dataset.v]; S.draw[b.dataset.v] = on; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.blur(); });
$('segTrk').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  $('segTrk').querySelectorAll('button').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  b.blur(); setDensity(b.dataset.v === 'dense'); });
$('theme').onclick = () => { setTheme(S.theme === 'dark' ? 'light' : 'dark'); $('theme').blur(); };
$('fileImg').onchange = e => { const f = [...e.target.files]; e.target.value = ''; addFiles(f); };
$('addBtn').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); $('fileImg').click(); } });
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dragging'); addFiles(e.dataTransfer.files); });
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const onRange = e.target.matches && e.target.matches('input[type=range]');
  if (onRange && /^Arrow|Home|End|Page/.test(e.key)) return;
  const k = e.key.toLowerCase();
  if (k === ' '){ e.preventDefault(); step(1); }
  else if (k === 'arrowright') step(1);
  else if (k === 'arrowleft') step(-1);
  else if (k >= '1' && k <= '9') select(Number(k) - 1);
  else if (k === 'h') document.body.classList.toggle('hide-ui');
  else if (k === 'b') setTheme(S.theme === 'dark' ? 'light' : 'dark');
});
for (const ev of ['pointerup', 'pointercancel']) addEventListener(ev, () => { const a = document.activeElement; if (a && a.matches && a.matches('input[type=range]')) a.blur(); }, true);

/* ---------- start ---------- */
if (!gl){ hint('This browser cannot draw the particles (WebGL 2 is off or missing).'); }
else {
  try {
    compile();
    applyBits(DENSE_BITS);
    G.dust = dustForm(); S.slots[2] = {form: G.dust, perm: [1, 0]};
    themeIcon(); resize(); drawPad(); veil.until = 0;
    hint('Drag to view simulation', 8000);
    requestAnimationFrame(frame);
    setTimeout(loadDemos, 30);
  } catch (err) { hint('Could not start: ' + err.message); console.error(err); }
}
</script>
</body>
</html>
